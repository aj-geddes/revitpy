name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check revitpy/ tests/

      - name: Run ruff format check
        run: ruff format --check revitpy/ tests/

  type-check:
    name: Type Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy revitpy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (optional integrations skipped)
        run: pytest tests/ --cov=revitpy --cov-report=term --cov-report=xml

  test-integrations:
    name: Test with optional integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (ifcopenshell, specklepy, ...)
        run: pip install -e ".[dev,all]"

      - name: Run tests
        run: pytest tests/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,all]" pip-audit

      - name: Run pip-audit
        run: pip-audit --skip-editable

      - name: Run ruff security checks
        run: ruff check --select S revitpy/ tests/

  addin:
    name: Revit add-in (Revit ${{ matrix.revit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ["2024", "2025", "2026", "2027"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: >
          dotnet build src/RevitPy.Addin/RevitPy.Addin.csproj
          -c Release -p:RevitVersion=${{ matrix.revit }}

      - uses: actions/upload-artifact@v7
        with:
          name: RevitPy.Addin-Revit${{ matrix.revit }}
          path: |
            src/RevitPy.Addin/bin/Release/${{ matrix.revit }}/*.dll
            src/RevitPy.Addin/RevitPy.addin

  docs:
    name: Docs site (Jekyll)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install github-pages gems
        working-directory: docs
        run: bundle install

      - name: Build (same gem set as GitHub Pages)
        working-directory: docs
        run: bundle exec jekyll build --strict_front_matter --baseurl /revitpy --destination ../_site

      - name: Check internal links
        run: python3 scripts/check_site_links.py _site --baseurl /revitpy

  package-manager:
    name: Package manager (registry/builder/installer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revitpy-package-manager
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: revitpy-package-manager/pyproject.toml

      - name: Install
        run: pip install -e ".[test]" pip-audit

      - name: Run tests (with coverage gate)
        run: pytest tests

      - name: Audit dependencies
        run: pip-audit --skip-editable

  dev-cli:
    name: Dev CLI (revitpy-dev) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ./cli pip-audit

      - name: Smoke test
        run: |
          revitpy-dev --help
          revitpy-dev version

      - name: Audit dependencies
        run: pip-audit --skip-editable

  pocs:
    name: Proofs of concept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            proof-of-concepts/pyproject.toml

      - name: Install RevitPy and the PoCs
        run: pip install -e . -e "./proof-of-concepts[test]"

      - name: Lint
        run: |
          pip install "ruff>=0.15.4"
          ruff check proof-of-concepts
          ruff format --check proof-of-concepts

      - name: Run PoC tests (uses proof-of-concepts/pyproject.toml config)
        working-directory: proof-of-concepts
        run: pytest

  vscode-extension:
    name: VS Code extension (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm test
      - run: npx vsce package
      - if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: revitpy-vscode-vsix
          path: vscode-extension/*.vsix

  dev-server:
    name: Dev server (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install revitpy (real Live Server integration test)
        working-directory: .
        run: pip install -e .

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dev-server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Test
        run: npm test
        env:
          REVITPY_PYTHON: python
          REVITPY_REQUIRE_REAL_SERVER: "1"

      - name: Check the packed CLI
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/pack" && cd "$RUNNER_TEMP/pack"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/dev-server/revitpy-dev-server-*.tgz
          npx revitpy-dev-server --version

  pyrevit-bridge:
    name: pyRevit bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" -e pyrevit-bridge/analyses vermin
      - name: Lint
        run: |
          ruff check pyrevit-bridge
          ruff format --check pyrevit-bridge
      - name: Test (includes the Python 2.7 compatibility check)
        run: pytest pyrevit-bridge/tests -o addopts="" -p no:cacheprovider
