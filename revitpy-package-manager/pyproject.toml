[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revitpy-package-manager"
version = "0.1.0"
description = "Complete package management system for RevitPy framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "High Velocity Solutions", email = "team@highvelocitysolutions.com"}
]
keywords = ["revit", "bim", "python", "package-manager", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Architecture",
]
requires-python = ">=3.11"

dependencies = [
    # Web Framework
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.10.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.48",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",  # PostgreSQL async driver
    "aiosqlite>=0.21.0",  # SQLite async driver (desktop registry)

    # Storage and Caching
    "boto3>=1.40.0",  # AWS S3
    "redis>=6.0.0",
    "aiofiles>=24.1.0",

    # Security and Cryptography
    "cryptography>=50.0.0",
    "PyJWT>=2.13.0",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.31",

    # Package Management
    "packaging>=24.2",
    "pip-tools>=7.5.0",
    "wheel>=0.46.2",
    "virtualenv>=20.36.1",

    # HTTP and Networking
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "websockets>=15.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "certifi>=2025.1.31",

    # CLI and UI
    "click>=8.3.3",
    "rich>=14.3.3",
    "typer>=0.16.0",
    "questionary>=2.1.0",

    # Utilities
    "pyyaml>=6.0.2",
    "toml>=0.10.2",
    "python-dateutil>=2.9.0",
    "email-validator>=2.2.0",
    "python-slugify>=8.0.4",

    # Monitoring and Logging
    "structlog>=25.1.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.3",
    "testcontainers>=4.10.0",
]

dev = [
    "revitpy-package-manager[test]",
    "black>=26.3.1",
    "isort>=6.0.0",
    "flake8>=7.1.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/aj-geddes/revitpy/tree/main/revitpy-package-manager"
Documentation = "https://aj-geddes.github.io/revitpy/"
Repository = "https://github.com/aj-geddes/revitpy"
Issues = "https://github.com/aj-geddes/revitpy/issues"

[project.scripts]
revitpy-registry = "revitpy_package_manager.registry.api.main:main"
revitpy-install = "revitpy_package_manager.installer.cli.main:main"
revitpy-build = "revitpy_package_manager.builder.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["revitpy_package_manager*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.toml", "*.sql"]

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["revitpy_package_manager"]

# MyPy type checking
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "factory_boy.*",
    "testcontainers.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=revitpy_package_manager"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["revitpy_package_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet: measured 59% when the suite was first made green (2026-09).
# Raise this as coverage improves; never lower it.
fail_under = 58
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
